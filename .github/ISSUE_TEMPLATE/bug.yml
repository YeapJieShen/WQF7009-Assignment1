name: Bug report
description: Something in the code is broken
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. Run `python ...`"
  - type: textarea
    id: logs
    attributes:
      label: Error output
      render: shell
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Python 3.x, shap x.y, OS"
