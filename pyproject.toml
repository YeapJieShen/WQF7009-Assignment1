[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wqf7009-assignments"
version = "0.1.0"
description = "WQF7009 Explainable AI assignments: SHAP on stroke prediction, LRP and Grad-CAM on brain MRI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "imbalanced-learn>=0.12",
    "matplotlib>=3.8",
    "numpy>=1.26",
    # dice-ml (04_counterfactuals.py) breaks on pandas 3
    "pandas>=2.1,<3",
    "scikit-learn>=1.4",
    "shap>=0.45",
]

[project.optional-dependencies]
# 01_interpretable_models.py, 02_lime.py
interpret = ["interpret>=0.6", "lime>=0.2"]
# 04_counterfactuals.py
counterfactuals = ["dice-ml>=0.11"]
# 05_lrp.py
lrp = ["torch>=2.2", "torchvision>=0.17"]
# Running notebooks/ (03_deep_shap_mlp.ipynb needs torch)
notebook = ["ipykernel>=6", "nbconvert>=7", "scipy>=1.11", "torch>=2.2"]
# Linting and formatting
dev = ["ruff>=0.6"]
# Everything above
all = ["wqf7009-assignments[interpret,counterfactuals,lrp,notebook,dev]"]

# Shared helpers for the notebooks: src/stroke_shap
[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
# Provided course scripts are kept as given
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "D"]
# N803/N806: X for predictor matrices is the scikit-learn convention
ignore = ["N803", "N806", "D105", "D107"]
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["D", "E402"]
